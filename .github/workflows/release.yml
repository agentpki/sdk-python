name: release

# Auto-publish to PyPI when a tag matching v* is pushed.
#
# Usage:
#   git tag v0.1.0a2
#   git push --tags
#
# Uses PyPI Trusted Publishing (OIDC) — no API token required.
# One-time setup at PyPI:
#   1. https://pypi.org/manage/account/publishing/
#   2. Add a new pending publisher:
#        PyPI Project Name: agentpki
#        Owner:             agentpki
#        Repository name:   sdk-python
#        Workflow name:     release.yml
#        Environment name:  pypi
#   3. After first successful publish, PyPI promotes this to an active
#      Trusted Publisher.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write   # required for PyPI trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi    # binds to the Trusted Publisher config above

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          python -m pip install --upgrade build

      - name: Round-trip sanity test (21 checks)
        env:
          PYTHONIOENCODING: utf-8
        run: python examples/round_trip.py

      - name: Verify tag matches pyproject version
        run: |
          PKG_VERSION=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION does not match pyproject.toml $PKG_VERSION"
            exit 1
          fi

      - name: Build
        run: python -m build

      - name: Publish to PyPI via Trusted Publishing (no token needed)
        uses: pypa/gh-action-pypi-publish@release/v1
