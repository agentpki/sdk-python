[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentpki"
version = "0.1.0a1"
description = "Python SDK for AgentPKI — cryptographic identity for AI agents. PASETO v4 passports, Ed25519 signing, RFC 9421 HTTP Message Signatures."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "AgentPKI" }]
keywords = ["agentpki", "ai-agents", "identity", "pki", "paseto", "ed25519", "rfc9421"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
  "Typing :: Typed",
]
dependencies = [
  "cryptography>=42.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage      = "https://agentpki.dev"
Specification = "https://agentpki.dev/spec/v0.1"
Repository    = "https://github.com/agentpki/sdk-python"
Issues        = "https://github.com/agentpki/sdk-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agentpki"]

[tool.hatch.build.targets.sdist]
include = ["src/agentpki", "examples", "pyproject.toml", "README.md"]
